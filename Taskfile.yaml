version: '3'

tasks:
  dev:
    cmds:
      - mprocs "task backend:dev" "task frontend:dev"

  backend:dev:
    cmds:
      - go run . 
    silent: true
    dir: ./server

  backend:build:
    cmds:
      - go build -o bin/ci
    silent: true
    dir: ./server

  frontend:dev:
    cmds:
      - pnpm dev 
    silent: true
    dir: ./web
